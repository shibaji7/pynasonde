# pynasonde dev environment.   Create/update with:  make env
# (equivalent to: conda env create -f env.yml  |  conda env update -f env.yml --prune)
# `make install-dev` re-runs the editable pip install if you change pyproject.toml.
name: pynasonde
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - tesseract          # system binary used by the ionogram OCR parser
  - pip:
      - -e .[dev,docs]
